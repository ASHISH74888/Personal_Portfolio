<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashish Kumar Singh — Engineer's Field Notes</title>
    <meta
      name="description"
      content="Ashish Kumar Singh — full-stack engineer. Field notes on building software, systems, and interfaces."
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              // Rounded, friendly sans (Nunito) across display + body,
              // with a technical mono for kickers, numerals, and metadata.
              display: ['Nunito', 'system-ui', 'sans-serif'],
              serif: ['Nunito', 'system-ui', 'sans-serif'],
              sans: ['Nunito', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
            },
            colors: {
              paper: '#f4efe6',        // warm cream canvas
              'paper-raised': '#fbf8f1', // lifted panels
              'paper-sunk': '#ebe3d4',   // recessed bands
              ink: '#1c1a17',          // warm near-black
              'ink-soft': '#5c5548',   // muted body text
              'ink-faint': '#938b7c',  // metadata / captions
              rust: '#ff490a',         // primary accent — vermilion
              'rust-deep': '#cc3a08',  // accent hover / pressed
              amber: '#b7791f',        // warm secondary accent
              olive: '#6b6a3a',        // terminal $ / diff-add
            },
            letterSpacing: {
              tightest: '-0.03em',
            },
            keyframes: {
              'marquee-scroll': {
                from: { transform: 'translateX(0)' },
                to: { transform: 'translateX(-50%)' },
              },
            },
            animation: {
              marquee: 'marquee-scroll 40s linear infinite',
            },
          },
        },
      };
    </script>
    <script type="importmap">
      {
        "imports": {
          "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
          "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
          "react/": "https://esm.sh/react@^19.2.3/",
          "react": "https://esm.sh/react@^19.2.3",
          "framer-motion": "https://esm.sh/framer-motion@^12.27.5"
        }
      }
    </script>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
